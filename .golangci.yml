version: "2"

# Size and structure rules (funlen, gocognit, nestif, revive argument-limit,
# gochecknoglobals, gochecknoinits) apply to the whole repo, next to the
# default linters (errcheck, govet, staticcheck, ineffassign, unused).
#
# Allowed exceptions, each with a targeted `//nolint:<linter> // <reason>`:
# constants, lookup tables, generated code and cobra command variables.
linters:
  default: standard
  enable:
    - funlen
    - gocognit
    - nestif
    - revive
    - gochecknoglobals
    - gochecknoinits
  settings:
    funlen:
      lines: 40
      statements: -1
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: argument-limit
          arguments: [3]
  exclusions:
    # out/ is local, git-ignored scratch (probes and build output).
    paths:
      - '^out/'
    rules:
      # Generated code and data tables are exempt from funlen.
      - linters:
          - funlen
        path: '(\.pb\.go|keycodes\.go|_test\.go)$'
      # Test helpers may take *testing.T on top of the 3-argument limit.
      - linters:
          - revive
        path: '_test\.go$'
        text: 'argument-limit'
